<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Central Psicopedagógica — biblioteca digital da Apostila Completa de Avaliação e Intervenção Psicopedagógica 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* reset base (padrão web; equivale ao que o preview injetava) */
  html,body{margin:0}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Central Psicopedagógica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  ============================================================
  CENTRAL PSICOPEDAGÓGICA — Biblioteca digital premium (dark)
  Produto: "Apostila Completa de Avaliação e Intervenção
  Psicopedagógica 2026". SPA mobile-first, fiel ao raio-x.
  Dois níveis de acesso: Apostila (R$10) e Combo (R$27,97).
  ------------------------------------------------------------
  ILUSTRAÇÕES 3D (arquivos locais publicados junto da página):
    img/banner.png       -> banner principal (Home)
    img/apostila.png     -> Apostila Completa
    img/guia.png         -> Guia Prático 2026
    img/kit.png          -> Kit Visual
    img/drive.png        -> Drive Profissional
    img/atividades.png   -> 1500 Atividades
    img/jogos.png        -> 20 Jogos
    img/bonus.png        -> Bônus Extras

  >>> O QUE TROCAR ANTES DE IR AO AR:
   - LINKS DE DOWNLOAD: cada material tem `file: null`.
     Procure por  // COLAR LINK REAL AQUI  e por  data-arquivo
   - PLANO DO USUÁRIO: escolhido em "Conta" e salvo no navegador
     (placeholder). Troque por integração real de acesso/login.
   - ITENS "NÃO IDENTIFICADO": 20 Jogos, metadados do Kit Visual,
     separação das 1.500 atividades. Marcados com <!-- TROCAR -->.
  ============================================================
-->
<style>
  /* ---- Layout: app shell dark premium, telas (SPA), barra inferior no mobile ---- */
  /* ---- Paleta: azul-marinho / roxo / pervinca + menta e dourado (tema único, dark) ---- */
  :root{
    --bg:#0C0E24;
    --bg-2:#111436;
    --glow-purple:#3a2d7a;
    --surface:#181B3E;        /* cards */
    --surface-2:#1E2250;      /* blocos internos */
    --surface-hi:rgba(255,255,255,.035);
    --border:rgba(170,178,255,.12);
    --border-hi:rgba(140,150,255,.34);
    --fg:#EEF0FF;
    --fg-soft:#C6C9F0;
    --muted:#8B90C4;
    --primary:#8B90F8;        /* azul-pervinca */
    --primary-2:#6C72F0;
    --primary-soft:rgba(124,131,243,.14);
    --purple:#7A5CF0;
    --lavender:#B9B5F5;
    --mint:#5BE0AD;           /* verde-menta */
    --mint-soft:rgba(91,224,173,.14);
    --gold:#F3C56C;           /* dourado suave */
    --gold-soft:rgba(243,197,108,.14);
    --grad-cta:linear-gradient(135deg,#8B90F8,#6C5CE7);
    --shadow:0 2px 6px rgba(0,0,0,.35), 0 18px 44px rgba(0,0,0,.42);
    --shadow-hover:0 4px 10px rgba(0,0,0,.4), 0 26px 60px rgba(72,60,180,.4);
    --radius:20px;
    --radius-sm:13px;
    --maxw:1120px;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    color:var(--fg);
    background:
      radial-gradient(1200px 680px at 78% -8%, rgba(108,92,231,.26), transparent 60%),
      radial-gradient(900px 560px at 8% 4%, rgba(91,224,173,.08), transparent 55%),
      linear-gradient(180deg,#0C0E24 0%, #0B0D20 60%, #0A0C1C 100%);
    background-attachment:fixed;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-bottom:86px;
  }
  h1,h2,h3,h4{font-family:"Plus Jakarta Sans","Inter",sans-serif; color:var(--fg); margin:0; text-wrap:balance; letter-spacing:-.015em}
  a{color:inherit}
  button{font-family:inherit; color:inherit}
  img{max-width:100%}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  .wrap{max-width:var(--maxw); margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
  ::selection{background:rgba(139,144,248,.35)}

  /* ---- Band acima do header (safe-area) ---- */
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:#0C0E24}

  /* ---- Header ---- */
  header.app{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:rgba(12,14,36,.72); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--border)}
  .head-row{display:flex; align-items:center; gap:12px; height:62px}
  .brand{display:flex; align-items:center; gap:11px; cursor:pointer; background:none; border:0; padding:0; min-width:0}
  .brand .mark{width:36px; height:36px; border-radius:11px; background:var(--grad-cta); display:grid; place-items:center; color:#fff; flex:none; box-shadow:0 6px 18px rgba(108,92,231,.45)}
  .brand .mark svg{width:20px; height:20px}
  .brand .txt{display:flex; flex-direction:column; line-height:1.12; min-width:0}
  .brand .txt b{font-family:"Plus Jakarta Sans",sans-serif; font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand .txt span{font-size:11px; color:var(--muted)}
  .head-spacer{flex:1}
  .iconbtn{width:42px; height:42px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg-soft); display:grid; place-items:center; cursor:pointer; transition:.16s}
  .iconbtn:hover{border-color:var(--border-hi); color:var(--primary); transform:translateY(-1px)}
  .iconbtn svg{width:20px; height:20px}
  .plan-chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:999px; background:var(--primary-soft); color:var(--primary); border:1px solid var(--border); white-space:nowrap}
  .plan-chip.combo{background:var(--gold-soft); color:var(--gold); border-color:rgba(243,197,108,.3)}
  .plan-chip svg{width:13px;height:13px}

  /* ---- Screens ---- */
  .screen{display:none}
  .screen.active{display:block; animation:fade .34s ease}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  section.block{padding-block:20px}

  /* ---- Banner (Home) ---- */
  .banner{display:block; width:100%; border:0; padding:0; cursor:pointer; position:relative; border-radius:24px; overflow:hidden; background:linear-gradient(180deg,#14163a,#0f1230); box-shadow:var(--shadow); border:1px solid var(--border); transition:transform .25s, box-shadow .25s, border-color .25s}
  .banner:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:var(--border-hi)}
  .banner:focus-visible{outline:2px solid var(--primary); outline-offset:3px}
  .banner img{display:block; width:100%; height:auto; object-fit:contain}
  .banner .cue{position:absolute; right:14px; bottom:14px; display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:#fff; background:rgba(16,18,44,.6); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.14); padding:8px 13px; border-radius:999px; opacity:.9; transition:.2s}
  .banner:hover .cue{opacity:1; transform:translateX(2px)}
  .banner .cue svg{width:15px;height:15px}
  @media (max-width:600px){ .banner .cue{display:none} }

  /* ---- Search ---- */
  .searchbar{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:13px 15px; box-shadow:var(--shadow)}
  .searchbar:focus-within{border-color:var(--border-hi); box-shadow:0 0 0 3px var(--primary-soft)}
  .searchbar svg{width:20px; height:20px; color:var(--muted); flex:none}
  .searchbar input{border:0; outline:0; background:none; flex:1; font-size:15px; color:var(--fg); min-width:0}
  .searchbar input::placeholder{color:var(--muted)}

  /* ---- Section headings ---- */
  .sec-head{display:flex; align-items:end; justify-content:space-between; gap:12px; margin:2px 0 14px}
  .sec-head h2{font-size:20px; font-weight:800}
  .sec-head p{margin:3px 0 0; color:var(--muted); font-size:13px}
  .kicker{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--primary)}

  /* ---- Comece por aqui ---- */
  .start{position:relative; overflow:hidden; width:100%; text-align:left; border:1px solid var(--border-hi); color:#fff; border-radius:var(--radius); padding:22px; cursor:pointer;
    background:linear-gradient(130deg, rgba(124,131,243,.9), rgba(108,92,231,.85) 55%, rgba(90,70,200,.85));
    box-shadow:0 18px 44px rgba(76,62,170,.4); transition:transform .22s, box-shadow .22s}
  .start:hover{transform:translateY(-2px); box-shadow:0 24px 56px rgba(76,62,170,.5)}
  .start:focus-visible{outline:2px solid #fff; outline-offset:3px}
  .start .orb{position:absolute; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%); right:-50px; top:-60px}
  .start .orb2{position:absolute; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,rgba(91,224,173,.3),transparent 70%); right:90px; bottom:-60px}
  .start h3{color:#fff; font-size:20px; font-weight:800; position:relative}
  .start p{margin:8px 0 16px; color:rgba(255,255,255,.92); max-width:48ch; font-size:14px; position:relative}
  .btn-white{display:inline-flex; align-items:center; gap:8px; background:#fff; color:#4733b8; border:0; border-radius:12px; padding:12px 18px; font-weight:800; font-size:14px; box-shadow:0 8px 20px rgba(0,0,0,.22); position:relative}
  .btn-white svg{width:17px;height:17px}

  /* ---- Finder ("O que você precisa hoje?") ---- */
  .finder{background:linear-gradient(160deg, rgba(243,197,108,.08), var(--surface) 42%); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow)}
  .finder h3{font-size:17px; font-weight:800}
  .finder p{margin:4px 0 14px; color:var(--muted); font-size:13px}
  .finder-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .finder-btn{display:flex; align-items:center; gap:11px; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:13px; cursor:pointer; transition:.18s; font-size:13.5px; font-weight:600; color:var(--fg)}
  .finder-btn:hover{border-color:var(--border-hi); transform:translateY(-2px); background:#242963}
  .finder-btn .fi{width:36px; height:36px; border-radius:11px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; flex:none}
  .finder-btn .fi svg{width:19px;height:19px}

  /* ---- Library grid + rich cards ---- */
  .grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  @media (max-width:520px){ .grid{grid-template-columns:repeat(2,1fr); gap:12px} }
  @media (max-width:360px){ .grid{grid-template-columns:1fr} }

  .lib-card{position:relative; text-align:left; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; overflow:hidden; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .2s, box-shadow .2s, border-color .2s; animation:rise .5s ease backwards}
  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .lib-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-hover); border-color:var(--border-hi)}
  .lib-card:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
  .lib-card .thumb{position:relative; height:138px; display:grid; place-items:center; overflow:hidden}
  .lib-card .thumb::before{content:""; position:absolute; inset:0; background:radial-gradient(130px 120px at 50% 42%, var(--acc-glow), transparent 72%)}
  .lib-card .thumb img{position:relative; max-height:108px; width:auto; max-width:78%; object-fit:contain; filter:drop-shadow(0 12px 20px rgba(0,0,0,.4)); transition:transform .28s ease}
  .lib-card:hover .thumb img{transform:scale(1.07) translateY(-2px)}
  @media (max-width:520px){ .lib-card .thumb{height:118px} .lib-card .thumb img{max-height:90px} }
  .lib-card .body{padding:14px 15px 15px; display:flex; flex-direction:column; gap:7px; flex:1; border-top:1px solid var(--border)}
  .lib-card h3{font-size:16px; font-weight:800; line-height:1.2}
  .lib-card .d{color:var(--muted); font-size:12.5px; line-height:1.38; flex:1}
  .lib-card .foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:3px}
  .count{font-size:11px; font-weight:800; color:var(--fg-soft); background:var(--surface-2); border:1px solid var(--border); padding:4px 10px; border-radius:999px; letter-spacing:.02em}
  .chev{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);transition:.2s}
  .lib-card:hover .chev{background:var(--primary); color:#fff; transform:translateX(2px)}
  .chev svg{width:16px;height:16px}
  .lock{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; color:var(--gold); background:var(--gold-soft); padding:4px 9px; border-radius:999px; border:1px solid rgba(243,197,108,.3)}
  .lock svg{width:12px;height:12px}
  .lib-card.locked .thumb img{filter:drop-shadow(0 10px 18px rgba(0,0,0,.4)) saturate(.7) opacity(.78)}
  .plan-flag{position:absolute; top:10px; right:10px; z-index:2; font-size:9.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:4px 8px; border-radius:999px; background:rgba(12,14,36,.72); backdrop-filter:blur(6px); border:1px solid var(--border)}
  .plan-flag.c{color:var(--gold)} .plan-flag.b{color:var(--mint)}

  /* ---- Detail screen ---- */
  .backbtn{display:inline-flex; align-items:center; gap:7px; background:none; border:0; color:var(--primary); font-weight:700; font-size:14px; cursor:pointer; padding:16px 0 8px}
  .backbtn:hover{color:var(--lavender)}
  .backbtn svg{width:18px;height:18px}
  .detail-hero{position:relative; overflow:hidden; display:flex; gap:20px; align-items:center; border:1px solid var(--border-hi); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); margin-bottom:6px;
    background:linear-gradient(130deg, var(--acc-wash), var(--surface) 60%)}
  .detail-hero .dh-art{flex:none; width:148px; display:grid; place-items:center; position:relative}
  .detail-hero .dh-art::before{content:""; position:absolute; inset:-10px; background:radial-gradient(90px 80px at 50% 50%, var(--acc-glow), transparent 72%)}
  .detail-hero .dh-art img{position:relative; width:100%; max-height:150px; object-fit:contain; filter:drop-shadow(0 16px 26px rgba(0,0,0,.45))}
  .detail-hero .dh-txt{min-width:0; flex:1}
  .detail-hero h2{font-size:23px; font-weight:800}
  .detail-hero p{margin:7px 0 0; color:var(--fg-soft); font-size:14px}
  .detail-tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px}
  .tag{font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:999px; background:var(--surface-2); color:var(--fg-soft); border:1px solid var(--border)}
  @media (max-width:600px){
    .detail-hero{flex-direction:column; text-align:center; gap:10px; padding:20px 18px}
    .detail-hero .dh-art{width:130px}
    .detail-hero .detail-tags{justify-content:center}
    .detail-hero h2{font-size:21px}
  }

  /* ---- Groups / subcategories ---- */
  .group{margin-top:22px}
  .group > h3{font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:9px; margin-bottom:4px}
  .group > h3 .dot{width:10px;height:10px;border-radius:3px; flex:none}
  .group > .gd{color:var(--muted); font-size:12.5px; margin:0 0 12px 19px}
  .mat-list{display:grid; gap:10px}
  .mat{display:flex; gap:13px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:13px; box-shadow:0 8px 22px rgba(0,0,0,.25); transition:border-color .16s, transform .16s}
  .mat:hover{border-color:var(--border-hi); transform:translateX(2px)}
  .mat .mico{width:42px;height:42px;border-radius:12px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; flex:none}
  .mat .mico svg{width:20px;height:20px}
  .mat .minfo{flex:1; min-width:0}
  .mat .minfo b{font-size:14px; font-weight:700; display:block; line-height:1.25}
  .mat .minfo .meta{font-size:11.5px; color:var(--muted); margin-top:2px}
  .mat .minfo .desc{font-size:12.5px; color:var(--fg-soft); margin-top:4px; line-height:1.35}
  .mat-actions{display:flex; gap:7px; flex:none}
  .mbtn{display:inline-flex; align-items:center; gap:6px; border-radius:11px; padding:9px 12px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--border); background:var(--surface-2); color:var(--fg-soft); transition:.15s; white-space:nowrap}
  .mbtn svg{width:15px;height:15px}
  .mbtn:hover{border-color:var(--border-hi); color:var(--primary)}
  .mbtn.dl{background:var(--grad-cta); border:0; color:#fff; box-shadow:0 6px 16px rgba(108,92,231,.4)}
  .mbtn.dl:hover{filter:brightness(1.06); color:#fff}
  .fav-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:9px;flex:none;transition:.15s}
  .fav-btn:hover{color:var(--lavender); transform:scale(1.1)}
  .fav-btn.on{color:var(--mint)}
  .fav-btn svg{width:20px;height:20px}
  @media (max-width:560px){
    .mat{flex-wrap:wrap}
    .mat-actions{width:100%; justify-content:flex-start; margin-left:55px}
  }

  /* ---- Locked / plan notice ---- */
  .notice{display:flex; gap:13px; background:linear-gradient(135deg,var(--gold-soft),var(--surface) 55%); border:1px solid rgba(243,197,108,.3); border-radius:var(--radius); padding:18px; margin-top:8px}
  .notice .ni{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#d99f3e);color:#2a1e06;display:grid;place-items:center;flex:none}
  .notice .ni svg{width:20px;height:20px}
  .notice b{font-size:14.5px}
  .notice p{margin:4px 0 0; font-size:13px; color:var(--fg-soft)}
  .notice .upg{margin-top:11px; display:inline-flex; align-items:center; gap:7px; background:var(--grad-cta); color:#fff; border:0; border-radius:11px; padding:10px 15px; font-weight:700; font-size:13px; cursor:pointer; box-shadow:0 6px 16px rgba(108,92,231,.4)}
  .notice .upg svg{width:15px;height:15px}

  /* TODO banner (não identificado) */
  .todo{display:flex; gap:10px; background:var(--surface-2); border:1px dashed rgba(243,197,108,.4); border-radius:15px; padding:14px; font-size:12.5px; color:var(--fg-soft); margin-top:12px}
  .todo svg{width:17px;height:17px;color:var(--gold);flex:none;margin-top:1px}
  .todo b{color:var(--fg)}

  /* ---- Empty states ---- */
  .empty{text-align:center; padding:52px 20px; color:var(--muted)}
  .empty .ei{width:66px;height:66px;border-radius:20px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 14px;color:var(--primary)}
  .empty .ei svg{width:30px;height:30px}
  .empty b{display:block;color:var(--fg);font-size:17px;font-family:"Plus Jakarta Sans",sans-serif;margin-bottom:6px}
  .empty p{margin:0 auto;max-width:34ch;font-size:13.5px}

  /* ---- Account ---- */
  .acc-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
  .acc-card h3{font-size:15px; font-weight:800; margin-bottom:12px}
  .acc-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border)}
  .acc-row:first-of-type{border-top:0}
  .acc-row .lab{font-size:13.5px;color:var(--muted)}
  .acc-row .val{font-size:13.5px;font-weight:700; text-align:right}
  .plan-pick{display:grid; gap:12px; grid-template-columns:1fr 1fr}
  @media (max-width:460px){.plan-pick{grid-template-columns:1fr}}
  .plan-opt{text-align:left; border:2px solid var(--border); border-radius:15px; padding:15px; cursor:pointer; background:var(--surface-2); transition:.16s}
  .plan-opt:hover{border-color:var(--border-hi)}
  .plan-opt.sel{border-color:var(--primary); background:linear-gradient(135deg,var(--primary-soft),var(--surface-2))}
  .plan-opt .pn{font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:8px}
  .plan-opt .pp{font-size:22px; font-weight:800; color:var(--primary); margin:7px 0 2px; font-family:"Plus Jakarta Sans",sans-serif}
  .plan-opt .px{font-size:11.5px; color:var(--muted); line-height:1.4}
  .check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;color:#fff;flex:none}
  .plan-opt.sel .check{background:var(--primary);border-color:var(--primary)}

/* ================================================================
   ESTADO (plano + favoritos) — placeholder salvo no navegador.
   >>> TROCAR por integração real de acesso/login. <<<
   ================================================================ */
const store = {
  getPlan(){ try{return localStorage.getItem('cp_plan')||'basic'}catch(e){return 'basic'} },
  setPlan(p){ try{localStorage.setItem('cp_plan',p)}catch(e){} },
  favs(){ try{return JSON.parse(localStorage.getItem('cp_favs')||'[]')}catch(e){return []} },
  toggleFav(id){ let f=store.favs(); f.includes(id)?f=f.filter(x=>x!==id):f.push(id); try{localStorage.setItem('cp_favs',JSON.stringify(f))}catch(e){}; return f.includes(id) },
  seenWelcome(){ try{return localStorage.getItem('cp_welcome')==='1'}catch(e){return true} },
  markWelcome(){ try{localStorage.setItem('cp_welcome','1')}catch(e){} },
};
function hasAccess(sec){ return sec.plan==='basic' || store.getPlan()==='combo'; }
function matId(secId, name){ return secId+'::'+name; }
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function glow(hex){ return hex+'3a'; }
function wash(hex){ return hex+'1f'; }

/* ================================================================
   COMPONENTES DE RENDER
   ================================================================ */
function libCard(sec, i, useFullDesc){
  const acc = hasAccess(sec);
  const onclick = acc ? `go('sec/${sec.id}')` : `toast('Material do Combo Profissional. Veja em Conta.')`;
  const desc = useFullDesc ? sec.desc : sec.short;
  return `<button class="lib-card ${acc?'':'locked'}" style="--acc-glow:${glow(sec.color)};animation-delay:${i*55}ms" onclick="${onclick}" aria-label="${esc(sec.title)}">
    <span class="plan-flag ${acc?'b':'c'}">${acc?(sec.plan==='basic'?'Apostila':'Combo'):'Combo'}</span>
    <div class="thumb">
      <img src="${sec.img}" alt="${esc(sec.title)}" loading="lazy" decoding="async">
    </div>
    <div class="body">
      <h3>${esc(sec.title)}</h3>
      <div class="d">${esc(desc)}</div>
      <div class="foot">
        ${sec.count?`<span class="count">${esc(sec.count)}</span>`:'<span></span>'}
        ${acc?`<span class="chev">${svg('arrow')}</span>`:`<span class="lock">${svg('lock')}Combo</span>`}
      </div>
    </div>
  </button>`;
}

function matRow(secId, it, accentColor){
  const id = matId(secId, it.name);
  const on = store.favs().includes(id);
  const ico = it.icon || 'download';
  const hasFile = !!it.file;
  return `<div class="mat">
    <div class="mico" style="background:${wash(accentColor)};color:${accentColor}">${svg(ico)}</div>
    <div class="minfo">
      <b>${esc(it.name)}</b>
      ${it.meta?`<div class="meta">${esc(it.meta)}</div>`:''}
      ${it.desc?`<div class="desc">${esc(it.desc)}</div>`:''}
    </div>
    <button class="fav-btn ${on?'on':''}" aria-label="Favoritar" data-fav="${esc(id)}" onclick="onFav(this,'${esc(id)}')">${svg('heart')}</button>
    <div class="mat-actions">
      <button class="mbtn" onclick="openMat('${esc(it.name)}',${hasFile})">${svg('eye')}Ver</button>
      <!-- COLAR LINK REAL AQUI: data-arquivo identifica o material -->
      <button class="mbtn dl" data-arquivo="${esc(id)}" onclick="download('${esc(it.name)}',${hasFile})">${svg('download')}Baixar</button>
    </div>
  </div>`;
}

/* ================================================================
   BUSCA
   ================================================================ */
function allMaterials(){
  const out=[];
  SECTIONS.forEach(sec=>{
    if(!hasAccess(sec)) return;
    if(sec.mainFile) out.push({sec, it:sec.mainFile, cat:'Principal'});
    (sec.groups||[]).forEach(g=>g.items.forEach(it=>out.push({sec, it, cat:g.name})));
  });
  return out;
}
function liveSearch(q){
  q=(q||'').trim().toLowerCase();
  const box = document.getElementById('searchResults');
  const grid = document.getElementById('bibGrid');
  if(box===null){ pendingQuery=q; go('biblioteca'); return; }
  if(!q){ box.innerHTML=''; if(grid) grid.style.display=''; return; }
  if(grid) grid.style.display='none';
  const res = allMaterials().filter(x=>{
    const hay=(x.it.name+' '+(x.it.meta||'')+' '+(x.it.desc||'')+' '+x.sec.title+' '+x.cat).toLowerCase();
    return hay.includes(q);
  });
  if(!res.length){
    box.innerHTML=`<div class="empty"><div class="ei">${svg('search')}</div><b>Nada encontrado para “${esc(q)}”</b><p>Tente outro termo como “TDAH”, “leitura”, “anamnese”, “rotina” ou “relatório”.</p></div>`;
    return;
  }
  const rows = res.map(x=>`<div class="mat">
      <div class="mico" style="background:${wash(x.sec.color)};color:${x.sec.color}">${svg(x.it.icon||x.sec.icon)}</div>
      <div class="minfo"><b>${esc(x.it.name)}</b><div class="meta">${esc(x.sec.title)} • ${esc(x.cat)}</div></div>
      <div class="mat-actions"><button class="mbtn" onclick="go('sec/${x.sec.id}')">${svg('arrow')}Abrir</button></div>
    </div>`).join('');
  box.innerHTML=`<div class="sec-head" style="margin-top:18px"><h2>${res.length} resultado${res.length>1?'s':''}</h2></div><div class="mat-list">${rows}</div>`;
}
let pendingQuery='';

/* ================================================================
   AÇÕES
   ================================================================ */
function onFav(btn, id){
  const now = store.toggleFav(id);
  document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b=>b.classList.toggle('on', now));
  toast(now?'Salvo nos favoritos':'Removido dos favoritos');
  if(currentRoute==='favoritos') render();
}
function download(name, hasFile){
  if(hasFile){ toast('Baixando: '+name); /* window.location = url real */ }
  else toast('Arquivo ainda não conectado — plugue o link real.');
}
function openMat(name, hasFile){
  if(hasFile){ toast('Abrindo: '+name); }
  else toast('Arquivo ainda não conectado — plugue o link real.');
}
function finderGo(route){ toast('Localizando materiais…'); go(route); }
function setPlan(p){
  store.setPlan(p); updatePlanChip(); render();
  toast(p==='combo'?'Combo Profissional ativado':'Plano Apostila ativado');
}
function updatePlanChip(){
  const c=document.getElementById('planChip');
  if(store.getPlan()==='combo'){ c.innerHTML=svg('spark')+'Combo Profissional'; c.className='plan-chip combo'; }
  else { c.innerHTML=svg('book')+'Apostila'; c.className='plan-chip'; }
}

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================================================================
   ROTEAMENTO (SPA)
   ================================================================ */
let currentRoute='home';
function go(route){
  currentRoute=route;
  const base = route.split('/')[0];
  try{ location.hash = route.replace('/','-'); }catch(e){}
  render();
  window.scrollTo({top:0, behavior:'auto'});
  document.querySelectorAll('.tab').forEach(t=>{
    const tn=t.dataset.tab;
    t.classList.toggle('active', tn===base || (base==='sec'&&tn==='biblioteca') || (base==='home'&&tn==='home'));
  });
}
function render(){
  const app=document.getElementById('app');
  const base=currentRoute.split('/')[0];
  let html='';
  if(base==='home') html=homeHTML();
  else if(base==='biblioteca') html=bibliotecaHTML();
  else if(base==='favoritos') html=favoritosHTML();
  else if(base==='conta') html=contaHTML();
  else if(base==='sec') html=sectionHTML(currentRoute.split('/')[1]);
  else html=homeHTML();
  app.innerHTML=`<div class="screen active">${html}</div>`;
  if(base==='biblioteca' && pendingQuery){
    const bs=document.getElementById('bibSearch');
    if(bs){ bs.value=pendingQuery; liveSearch(pendingQuery); }
    pendingQuery='';
  }
}

function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); store.markWelcome(); }

/* ================================================================
   INIT
   ================================================================ */
(function init(){
  updatePlanChip();
  const h=(location.hash||'').replace('#','').replace('-','/');
  currentRoute = h && (h.startsWith('sec/')||['home','biblioteca','favoritos','conta'].includes(h.split('/')[0])) ? h : 'home';
  go(currentRoute);
  if(!store.seenWelcome()){
    setTimeout(()=>document.getElementById('overlay').classList.add('show'), 650);
  }
})();
window.addEventListener('hashchange',()=>{
  const h=(location.hash||'').replace('#','').replace('-','/');
  if(h && h!==currentRoute){ currentRoute=h; render(); }
});
</script>
